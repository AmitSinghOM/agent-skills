name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skills against the Agent Skills spec
        run: python3 scripts/validate.py
      - name: Run repository contract tests
        run: python3 -m unittest discover -s tests -v
      - name: EVIDENCE.json must match validated inputs
        if: matrix.python-version == '3.12'
        run: python3 scripts/evidence.py --check

  gate-smoke:
    # Exercise code-quality-gate's wrapper against the real analyzer on this repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -P -m pip install --quiet cqa-analyzer==3.4.1
      - name: Manifest generator produces valid schema from a real diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          python3 skills/code-quality-gate/scripts/changed_lines_manifest.py --base "$BASE_REF" -o "$RUNNER_TEMP/cqa-manifest.json"
          python3 -P -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['schema_version']=='1.0.0'; print(len(d['files']),'files')" "$RUNNER_TEMP/cqa-manifest.json"
      - name: Wrapper runs report-only against the analyzer
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: skills/code-quality-gate/scripts/run-gate.sh --base "$BASE_REF" --report-only --format json > "$RUNNER_TEMP/cqa-report.json"
      - name: Output is well-formed JSON with analysis_health
        run: |
          python3 -P -c "import json,sys; d=json.load(open(sys.argv[1])); print('analysis_health:', d['analysis_health'])" "$RUNNER_TEMP/cqa-report.json"
